name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests (stdlib only, no install needed)
        run: python tests/test_tally.py
      - name: Build wheel + assert zero deps
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = zipfile.ZipFile(whl).read([n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA")][0]).decode()
          reqs = [l for l in meta.splitlines() if l.startswith("Requires-Dist:")]
          assert not reqs, "expected zero runtime deps, found: %s" % reqs
          print("zero-dep wheel OK:", whl)
          PY
