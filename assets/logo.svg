  </defs>
  <rect width="960" height="240" rx="24" fill="url(#bg)"/>
  <g stroke="url(#mark)" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="70" y1="70" x2="70" y2="170"/>
    <line x1="105" y1="70" x2="105" y2="170"/>
    <line x1="140" y1="70" x2="140" y2="170"/>
    <line x1="175" y1="70" x2="175" y2="170"/>
