<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="t d">
  <title id="t">tally</title>
  <desc id="d">The tally logo: five tally marks crossed by a stroke, beside the word tally and the tagline Track every AI limit and dollar, locally.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151c"/><stop offset="1" stop-color="#1b2430"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="0.6" stop-color="#fbbf24"/><stop offset="1" stop-color="#f87171"/>
