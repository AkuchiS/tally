  <text x="250" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#f3f6fa" letter-spacing="-2">tally</text>
  <text x="254" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#9aa8b8">Track every AI limit and dollar, locally.</text>
